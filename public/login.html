<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nusa. · Sign in</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/PlusJakartaSans.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="login.js"></script>
</head>
<body class="login-page">
  <div class="login-glow" aria-hidden="true">
    <div class="blob blob-pink"></div>
    <div class="blob blob-orange"></div>
    <div class="login-grain"></div>
  </div>

  <button id="login-lang" class="lang-switch login-lang" type="button" data-lang="en"><span class="lang-code">EN</span><span class="lang-knob"></span></button>

  <section class="login-hero">
    <div class="login-brand">
      <img class="login-logo" src="logo.svg" alt="" width="160" height="70">
      <span class="wordmark wordmark-xl" aria-label="nusa."><span>n</span><span>u</span><span>s</span><span>a</span><span class="wm-dot">.</span></span>
    </div>
    <p class="tagline" data-l="tagline">Know where your money goes.</p>
  </section>

  <section class="login-side">
    <main class="login-card">
      <div class="login-card-head">
        <span class="login-eyebrow" data-l="eyebrow">Sign in</span>
        <span class="read-only-pill"><span class="dot-pink"></span><span data-l="readOnly">Read-only</span></span>
      </div>
      <h1><span data-l="continueTo">Continue to</span> nusa<span class="wm-dot">.</span></h1>
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <a class="btn-google" href="/auth/login">
        <span class="g-circle">
          <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
        </span>
        <span data-l="button">Continue with Google</span>
      </a>
      <p class="login-note" data-l="note">Only the Google account set up for this app can sign in.</p>
    </main>
  </section>
  <footer class="login-foot">
    <div data-l="foot1">Platform</div>
    <div data-l="foot2">Monitored</div>
    <div data-l="foot3">Centralized</div>
  </footer>
</body>
</html>
